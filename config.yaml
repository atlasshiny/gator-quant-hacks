experiment:
  name: mbp10_microstructure_ga
  description: GPU-accelerated MBP-10 feature engineering, XGBoost, and genetic strategy search.

data:
  dataset: GLBX.MDP3
  symbol: ES.c.0
  schema: mbp-10
  stype_in: continuous
  start: "2024-01-08T00:00:00Z"
  end: "2024-01-12T23:59:59Z"
  parquet_dir: data/GLBX.MDP3
  unified_bin: data/unified_mbp10.bin

features:
  stationary_parquet: output/features/stationary_features.parquet
  expected_base_features: 25
  total_kernel_features: 28

xgboost:
  features_path: output/features/stationary_features.parquet
  output_dir: output/ga_inputs
  model_path: output/models/xgboost_final.json
  target_horizon_events: 100
  fee_threshold_bps: 1.5
  folds: 50
  embargo_pct: 0.01
  tree_method: hist
  device: cuda
  num_boost_round: 800
  early_stopping_rounds: 40
  max_depth: 6
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  num_class: 3
  explainability_dir: output/explainability
  shap_sample_rows: 50000

genetic_algorithm:
  features_path: output/ga_inputs/features.bin
  returns_path: output/ga_inputs/returns.bin
  output_dir: output/ga_results
  population: 1000
  generations: 400
  migration_frequency: 50
  chromosome_features: 28
